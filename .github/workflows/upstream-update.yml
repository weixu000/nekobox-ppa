name: Upstream release update

# GitHub stores packaging; Launchpad builds signed source uploads. A scheduled run
# detects a stable upstream release, prepares the packaging changes, validates
# every supported series with an offline build plus GUI/core smoke test, then
# (and only then) commits the packaging and uploads source packages.
#
# Manual modes:
#   validate  build and smoke-test the currently pinned source; no writes
#   auto      detect an update; publish only if "publish" is checked
#   reconcile validate the current pin, upload missing sources (no version bump), and
#             verify already published artifacts; duplicate builds are skipped
#
# The first hosted run should be mode=validate.  Set publish=true to let a
# manual auto/reconcile run write to GitHub and Launchpad.
#
# GitHub disables scheduled workflows after 60 days without repository
# activity.  Re-enable this workflow from the Actions tab if the daily run
# stops; there is no guaranteed keepalive API.

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 2 * * *" # 10:00 Asia/Shanghai
  workflow_dispatch:
    inputs:
      mode:
        description: "validate: no writes; auto: detect update; reconcile: current pin"
        type: choice
        options:
          - validate
          - auto
          - reconcile
        default: validate
      publish:
        description: "Commit validated packaging and upload signed sources to the PPA"
        type: boolean
        default: false
      require_published:
        description: "Fail unless the version is already published for every series"
        type: boolean
        default: false

concurrency:
  group: upstream-update
  cancel-in-progress: false

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      MODE: ${{ github.event_name == 'schedule' && 'auto' || github.event_name == 'push' && 'reconcile' || inputs.mode }}
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      update: ${{ steps.plan.outputs.update }}
      validate: ${{ steps.plan.outputs.validate }}
      version: ${{ steps.plan.outputs.version }}
      base_version: ${{ steps.plan.outputs.base_version }}
      base_sha: ${{ steps.plan.outputs.base_sha }}
      matrix: ${{ steps.plan.outputs.matrix }}
      series: ${{ steps.plan.outputs.series }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for a newer stable upstream release
        if: env.MODE == 'auto'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p build
          scripts/check-upstream.py >build/update-check.json

      - name: Run automation tests
        run: python3 -m unittest discover -s tests -v

      - name: Write the plan
        id: plan
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import runpy
          import subprocess
          from pathlib import Path

          mode = os.environ["MODE"]
          Path("build").mkdir(exist_ok=True)
          targets = runpy.run_path("scripts/source-upload.py")["SERIES"]
          images = {series: data["base"] for series, data in targets.items()}
          enabled = list(images)
          env = {}
          for raw in Path("upstream.env").read_text(encoding="utf-8").splitlines():
              line = raw.strip()
              if line and not line.startswith("#") and "=" in line:
                  key, value = line.split("=", 1)
                  env[key.strip()] = value.strip()

          current = env["UPSTREAM_VERSION"]
          update = "false"
          version = current
          if mode == "auto":
              check = json.loads(Path("build/update-check.json").read_text())
              if check.get("status") == "update-available":
                  update = "true"
                  version = check["candidate"]["version"]
              elif check.get("status") != "up-to-date":
                  raise SystemExit(f"unexpected check status: {check.get('status')}")
          base_version = f"{version}-{env['DEBIAN_REVISION']}"
          if mode == "auto" and update == "false":
              subprocess.run([
                  "python3", "scripts/source-upload.py", "plan",
                  "--json", "build/submission-plan.json",
              ], check=True)
              submission = json.loads(Path("build/submission-plan.json").read_text())
              for series, entry in submission["series"].items():
                  if entry.get("source_status") not in (None, "Published", "Pending"):
                      raise SystemExit(f"{series}: {entry['reason']}")
              if submission["needed_series"]:
                  mode = "reconcile"
          validate = "true" if (mode in ("validate", "reconcile") or update == "true") else "false"
          base_sha = subprocess.check_output(
              ["git", "rev-parse", "HEAD"], text=True
          ).strip()
          values = {
              "mode": mode,
              "update": update,
              "validate": validate,
              "version": version,
              "base_version": base_version,
              "base_sha": base_sha,
              "matrix": json.dumps({"include": [{"series": s, "base": images[s]} for s in enabled]}),
              "series": ",".join(enabled),
          }
          Path("build/plan.json").write_text(json.dumps(values, indent=2) + "\n")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              for key, value in values.items():
                  out.write(f"{key}={value}\n")
          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])
          with summary.open("a", encoding="utf-8") as out:
              out.write(f"### Plan\n\n- mode: `{mode}`\n- pinned: `{current}`\n")
              if update == "true":
                  out.write(f"- update available: `{version}`\n")
              else:
                  out.write("- update available: no\n")
              out.write(f"- base SHA: `{base_sha}`\n")
          PY

      - name: Upload the detected release
        if: steps.plan.outputs.update == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: update-check
          retention-days: 3
          path: build/update-check.json
          if-no-files-found: error

  prepare:
    name: Prepare packaging changes
    needs: plan
    if: needs.plan.outputs.update == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4

      - name: Use the runner temp directory
        run: echo "TMPDIR=$RUNNER_TEMP" >>"$GITHUB_ENV"

      - name: Download the detected release
        uses: actions/download-artifact@v4
        with:
          name: update-check
          path: build

      - name: Install packaging tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends dpkg-dev fakeroot xz-utils

      - name: Update pinned env and changelog
        run: |
          set -euo pipefail
          scripts/prepare-update.py --check-json build/update-check.json

      - name: Read the pinned version
        run: |
          set -euo pipefail
          . ./upstream.env
          echo "UPSTREAM_VERSION=$UPSTREAM_VERSION" >>"$GITHUB_ENV"
          echo "VERSION=$UPSTREAM_VERSION-$DEBIAN_REVISION" >>"$GITHUB_ENV"

      - name: Prepare the source tree
        run: |
          set -euo pipefail
          scripts/prepare-source.sh

      - name: Regenerate bundled licence notices
        run: |
          set -euo pipefail
          scripts/collect-notices.py --source "build/nekobox-$UPSTREAM_VERSION"

      - name: Verify the notice inventory
        run: |
          set -euo pipefail
          scripts/collect-notices.py --source "build/nekobox-$UPSTREAM_VERSION" --check

      - name: Build the packaging patch
        run: |
          set -euo pipefail
          git add -N -- .
          git diff --binary >build/update.patch
          test -s build/update.patch
          grep -q '^diff --git a/upstream.env ' build/update.patch
          grep -q '^diff --git a/debian/changelog ' build/update.patch
          bad=$(git status --porcelain | sed -E 's/^.. //' | \
              grep -Ev '^(upstream\.env|debian/changelog|debian/third-party/)' || true)
          if [ -n "$bad" ]; then
              printf 'unexpected changed paths:\n%s\n' "$bad" >&2
              exit 1
          fi
          python3 - <<'PY'
          import json
          from pathlib import Path
          meta = json.loads(Path("build/release.json").read_text())
          first = Path("debian/changelog").read_text().splitlines()[0]
          assert meta["base_version"] in first, first
          print(f"patch for {meta['base_version']} is consistent")
          PY

      - name: Upload the packaging patch
        uses: actions/upload-artifact@v4
        with:
          name: release-patch
          retention-days: 3
          path: |
            build/update.patch
            build/release.json
            build/update-check.json
          if-no-files-found: error

  validate:
    name: Validate ${{ matrix.series }}
    needs: [plan, prepare]
    if: |
      always() &&
      needs.plan.result == 'success' &&
      needs.plan.outputs.validate == 'true' &&
      (needs.prepare.result == 'success' || needs.prepare.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
    env:
      JOBS: "3"
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Use the runner temp directory
        run: echo "TMPDIR=$RUNNER_TEMP" >>"$GITHUB_ENV"

      - name: Download the packaging patch
        if: needs.plan.outputs.update == 'true'
        uses: actions/download-artifact@v4
        with:
          name: release-patch
          path: build

      - name: Apply the packaging patch
        if: needs.plan.outputs.update == 'true'
        run: |
          set -euo pipefail
          git apply --binary build/update.patch

      - name: Install source packaging tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            devscripts dpkg-dev fakeroot debhelper xz-utils

      - name: Prepare and roundtrip the exact source upload
        env:
          SERIES: ${{ matrix.series }}
        run: |
          set -euo pipefail
          python3 scripts/source-upload.py plan --series "$SERIES" --json build/upload-plan.json
          python3 scripts/source-upload.py prepare --plan build/upload-plan.json --series "$SERIES"
          python3 scripts/source-upload.py sign --unsigned --plan build/upload-plan.json --series "$SERIES"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          data = json.loads(Path(f"build/upload/{os.environ['SERIES']}/prepare.json").read_text())
          with open(os.environ["GITHUB_ENV"], "a") as out:
              out.write(f"BUILD_TREE={data['tree']}\nVERSION={data['target_version']}\n")
          PY

      - name: Save the validated source identity
        uses: actions/upload-artifact@v4
        with:
          name: source-identity-${{ matrix.series }}
          retention-days: 3
          path: build/upload/${{ matrix.series }}/prepare.json
          if-no-files-found: error

      - name: Offline build and smoke test on ${{ matrix.series }}
        run: |
          set -euo pipefail
          scripts/validate-offline-build.sh \
            --series "${{ matrix.series }}" \
            --base "${{ matrix.base }}" \
            --tree "$BUILD_TREE" --version "$VERSION"

      - name: Record the artifact
        if: always()
        run: |
          set -euo pipefail
          {
            echo "### ${{ matrix.series }}"
            for deb in build/upload/${{ matrix.series }}/nekobox_*.deb; do
              [ -e "$deb" ] || continue
              echo "- $(basename "$deb"): $(sha256sum "$deb" | awk '{print $1}')"
            done
            echo ""
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics-${{ matrix.series }}
          retention-days: 3
          path: |
            build/upload/${{ matrix.series }}/*.dsc
            build/upload/${{ matrix.series }}/*_source.changes
            build/upload/${{ matrix.series }}/*_source.buildinfo
            build/upload/${{ matrix.series }}/source.json
            build/upload/${{ matrix.series }}/build.log
            build/upload/${{ matrix.series }}/dpkg-source-extract.log
            build/offline-build.log
            build/prepare-source.log
          if-no-files-found: warn

  publish:
    name: Upload signed sources to Launchpad
    needs: [plan, prepare, validate]
    if: |
      always() &&
      needs.plan.result == 'success' &&
      needs.validate.result == 'success' &&
      (needs.plan.outputs.update == 'true' || needs.plan.outputs.mode == 'reconcile') &&
      (github.event_name == 'schedule' || github.event_name == 'push' || inputs.publish == true || inputs.mode == 'reconcile') &&
      needs.plan.outputs.mode != 'validate'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
      actions: read
    env:
      MODE: ${{ needs.plan.outputs.mode }}
      LP_WRITE: ${{ github.event_name == 'schedule' || github.event_name == 'push' || inputs.publish == true }}
      VERSION: ${{ needs.plan.outputs.version }}
      BASE_VERSION: ${{ needs.plan.outputs.base_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Use the runner temp directory
        run: echo "TMPDIR=$RUNNER_TEMP" >>"$GITHUB_ENV"

      - name: Refuse to publish from a moved main
        run: |
          set -euo pipefail
          current=$(git rev-parse HEAD)
          if [ "$current" != "${{ needs.plan.outputs.base_sha }}" ]; then
            echo "main moved from ${{ needs.plan.outputs.base_sha }} to $current" >&2
            exit 1
          fi

      - name: Download the packaging patch
        if: needs.plan.outputs.update == 'true'
        uses: actions/download-artifact@v4
        with:
          name: release-patch
          path: build

      - name: Apply the packaging patch
        if: needs.plan.outputs.update == 'true'
        run: |
          set -euo pipefail
          git apply --binary build/update.patch

      - name: Install source upload tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            devscripts dpkg-dev fakeroot debhelper xz-utils gnupg dput python3-launchpadlib

      - name: Plan missing uploads
        id: uploads
        run: |
          set -euo pipefail
          python3 scripts/source-upload.py plan --json build/upload-plan.json
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          plan = json.loads(Path("build/upload-plan.json").read_text())
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"needed={'true' if plan['needed_series'] else 'false'}\n")
          Path("build/needed-series").write_text("\n".join(plan["needed_series"]) + "\n")
          PY

      - name: Download validated source identities
        uses: actions/download-artifact@v4
        with:
          pattern: source-identity-*
          path: build/validated

      - name: Import the upload signing key and check Launchpad registration
        if: env.LP_WRITE == 'true' && steps.uploads.outputs.needed == 'true'
        env:
          LP_GPG_PRIVATE_KEY: ${{ secrets.LP_GPG_PRIVATE_KEY }}
          LP_GPG_PASSPHRASE: ${{ secrets.LP_GPG_PASSPHRASE }}
          LP_GPG_KEY_ID: ${{ secrets.LP_GPG_KEY_ID }}
        run: |
          set -euo pipefail
          [ -n "$LP_GPG_PRIVATE_KEY" ] || { echo "LP_GPG_PRIVATE_KEY is not configured" >&2; exit 1; }
          umask 077
          export GNUPGHOME="$RUNNER_TEMP/nekobox-signing"
          mkdir -m 700 "$GNUPGHOME"
          printf '%s\n' "$LP_GPG_PRIVATE_KEY" | gpg --batch --import
          printf '%s' "$LP_GPG_PASSPHRASE" >"$GNUPGHOME/passphrase"
          python3 - <<'PY'
          import os
          import subprocess
          lines = subprocess.check_output(
              ["gpg", "--batch", "--with-colons", "--list-secret-keys"], text=True
          ).splitlines()
          keys = []
          primary = False
          for line in lines:
              fields = line.split(":")
              if fields[0] == "sec":
                  primary = True
              elif fields[0] == "fpr" and primary:
                  keys.append(fields[9])
                  primary = False
          if len(keys) != 1:
              raise SystemExit("Import exactly one source-upload signing key")
          fingerprint = keys[0]
          expected = os.environ.get("LP_GPG_KEY_ID", "").replace(" ", "").upper()
          if expected and expected != fingerprint:
              raise SystemExit("LP_GPG_KEY_ID does not match the imported primary fingerprint")
          subprocess.run(
              ["python3", "scripts/source-upload.py", "preflight", "--fingerprint", fingerprint],
              check=True,
          )
          with open(os.environ["GITHUB_ENV"], "a") as out:
              out.write(f"SIGNING_KEY_FINGERPRINT={fingerprint}\n")
              out.write(f"GNUPGHOME={os.environ['GNUPGHOME']}\n")
              out.write(f"LP_GPG_PASSPHRASE_FILE={os.environ['GNUPGHOME']}/passphrase\n")
          PY

      - name: Assemble and sign the validated source uploads
        if: env.LP_WRITE == 'true' && steps.uploads.outputs.needed == 'true'
        run: |
          set -euo pipefail
          while IFS= read -r series; do
            [ -n "$series" ] || continue
            python3 scripts/source-upload.py prepare --plan build/upload-plan.json --series "$series"
            python3 - "$series" <<'PY'
          import json
          import sys
          from pathlib import Path
          series = sys.argv[1]
          expected = json.loads(Path(f"build/validated/source-identity-{series}/prepare.json").read_text())
          actual = json.loads(Path(f"build/upload/{series}/prepare.json").read_text())
          for key in ("target_version", "distribution", "debian_manifest"):
              if actual[key] != expected[key]:
                  raise SystemExit(f"{series}: validated source changed: {key}")
          if actual["orig"]["sha256"] != expected["orig"]["sha256"]:
              raise SystemExit(f"{series}: validated orig tarball changed")
          PY
            python3 scripts/source-upload.py sign --plan build/upload-plan.json \
              --series "$series" --keyid "$SIGNING_KEY_FINGERPRINT"
          done <build/needed-series

      - name: Commit and push the validated packaging update
        if: needs.plan.outputs.update == 'true' && env.LP_WRITE == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add upstream.env debian/changelog debian/third-party/
          git commit -m "Update upstream to $VERSION" -m \
            "Validated on noble, resolute and stonking before source upload."
          git push origin HEAD:refs/heads/main

      - name: Upload missing sources
        if: env.LP_WRITE == 'true' && steps.uploads.outputs.needed == 'true'
        run: |
          set -euo pipefail
          failed=0
          while IFS= read -r series; do
            [ -n "$series" ] || continue
            if ! python3 scripts/source-upload.py upload --plan build/upload-plan.json \
              --series "$series" --json "build/upload/$series/upload.json"; then
              echo "Source upload failed for $series; continuing with other targets" >&2
              failed=1
            fi
          done <build/needed-series
          exit "$failed"

      - name: Remove signing credentials
        if: always()
        run: |
          set -euo pipefail
          home="$RUNNER_TEMP/nekobox-signing"
          if [ -d "$home" ]; then
            GNUPGHOME="$home" gpgconf --kill all || true
            rm -rf "$home"
          fi
          printf 'GNUPGHOME=\nLP_GPG_PASSPHRASE_FILE=\nSIGNING_KEY_FINGERPRINT=\n' >>"$GITHUB_ENV"

      - name: Verify the published artifacts
        run: |
          set -euo pipefail
          args=(--base-version "$BASE_VERSION" --json build/published-verification.json --summary build/published-verification.md)
          if [ "${{ inputs.require_published }}" = "true" ]; then
            args+=(--require-published)
          fi
          python3 scripts/verify-published.py "${args[@]}"

      - name: Publish the run summary
        if: always()
        run: |
          set -euo pipefail
          if [ -f build/published-verification.md ]; then
            cat build/published-verification.md >>"$GITHUB_STEP_SUMMARY"
          fi
          python3 - <<'PY' >>"$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          for path in sorted(Path("build/upload").glob("*/upload.json")):
              entry = json.loads(path.read_text())
              print(f"- {path.parent.name}: `{entry.get('action')}` "
                    f"(archive: {entry.get('archive_status', 'not yet recorded')})")
          PY

      - name: Upload publication evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publication
          retention-days: 3
          path: |
            build/upload-plan.json
            build/upload/*/upload.json
            build/upload/*/source.json
            build/upload/*/*.dsc
            build/upload/*/*_source.changes
            build/upload/*/*_source.buildinfo
            build/upload/*/dput.log
            build/upload/*/build.log
            build/upload/*/dpkg-source-extract.log
            build/prepare-source.log
            build/published-verification.json
            build/published-verification.md
          if-no-files-found: warn
